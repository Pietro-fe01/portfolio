<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Portfolio di Pietro Fecarotta, Full Stack Web Developer con 3 anni di esperienza tra gestionali, prodotti verticali, NativeScript, Electron, Laravel e frontend curato."
    />
    <meta name="theme-color" content="#f5f1e9" />
    <script>
      (() => {
        const storageKey = 'portfolio-theme-preference';
        const savedPreference = window.localStorage.getItem(storageKey);
        const systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        const resolvedTheme =
          savedPreference === 'light' || savedPreference === 'dark' ? savedPreference : systemTheme;
        const themeColorMeta = document.querySelector('meta[name="theme-color"]');

        document.documentElement.dataset.theme = resolvedTheme;
        document.documentElement.style.colorScheme = resolvedTheme;

        if (themeColorMeta) {
          themeColorMeta.setAttribute('content', resolvedTheme === 'dark' ? '#08111c' : '#f5f1e9');
        }
      })();
    </script>
    <title>Pietro Fecarotta | Full Stack Web Developer</title>

    <!-- Favicon img -->
    <link rel="apple-touch-icon" sizes="180x180" href="/src/assets/favicon/apple-touch-icon.png">

    <link rel="icon" type="image/png" sizes="16x16" href="/src/assets/favicon/favicon-16x16.png">

  </head>
